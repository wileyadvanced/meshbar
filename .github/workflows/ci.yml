name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Bundle MeshBar.app
        run: scripts/bundle.sh
